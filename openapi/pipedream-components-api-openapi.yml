        description: This prop is used to configure an app webhook interface.
        required:
        - type
        - appProp
        properties:
          type:
            type: string
            enum:
            - $.interface.apphook
          appProp:
            type: string
            description: The name of the app prop that this apphook depends on
          eventNames:
            type: array
            items:
              type: string
            description: List of event names to listen for
            nullable: true
          remote:
            type: boolean
            description: Whether this apphook is remote
            nullable: true
          static:
            type: array
            items: {}
            description: Static configuration for the apphook
            nullable: true
    ConfigurablePropAirtableTableId:
      allOf:
      - $ref: '#/components/schemas/ConfigurablePropBase'
      - type: object
        description: This prop is used to select an Airtable table.
        required:
        - type
        - baseIdProp
        properties:
          type:
            type: string
            enum:
            - $.airtable.tableId
          baseIdProp:
            type: string
            description: The name of the prop that provides the Airtable base ID
    ConfiguredPropValue:
      nullable: false
      oneOf:
      - $ref: '#/components/schemas/ConfiguredPropValueAny'
      - $ref: '#/components/schemas/ConfiguredPropValueApp'
      - $ref: '#/components/schemas/ConfiguredPropValueBoolean'
      - $ref: '#/components/schemas/ConfiguredPropValueInteger'
      - $ref: '#/components/schemas/ConfiguredPropValueObject'
      - $ref: '#/components/schemas/ConfiguredPropValueSql'
      - $ref: '#/components/schemas/ConfiguredPropValueString'
      - $ref: '#/components/schemas/ConfiguredPropValueStringArray'
    ConfigurablePropStringArray:
      allOf:
      - $ref: '#/components/schemas/ConfigurablePropBase'
      - type: object
        description: This prop can accept an array of strings.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - string[]
          secret:
            type: boolean
            description: If true, this prop is a secret and should not be displayed in plain text.
            nullable: true
          format:
            $ref: '#/components/schemas/ConfigurablePropStringFormat'
          default:
            type: array
            items:
              $ref: '#/components/schemas/ConfiguredPropValueString'
            description: The default value for this prop
            nullable: true
          options:
            type: array
            items:
              anyOf:
              - $ref: '#/components/schemas/PropOption'
              - $ref: '#/components/schemas/PropOptionNested'
              - $ref: '#/components/schemas/PropOptionValue'
    ConfigurablePropHttpRequest:
      allOf:
      - $ref: '#/components/schemas/ConfigurablePropBase'
      - type: object
        description: This prop is used to configure an HTTP request with URL, method, headers, params, body, and authentication.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - http_request
          default:
            $ref: '#/components/schemas/HttpRequestConfig'
    ReloadPropsOpts:
      type: object
      description: Request options for reloading a component's props when dealing with dynamic props
      required:
      - id
      - external_user_id
      properties:
        id:
          type: string
          description: The component ID
        version:
          type: string
          description: Optional component version (in SemVer format, for example '1.0.0'), defaults to latest
          example: 1.2.3
          nullable: true
        external_user_id:
          type: string
          description: The external user ID
        blocking:
          type: boolean
          description: Whether this operation should block until completion
        configured_props:
          $ref: '#/components/schemas/ConfiguredProps'
        dynamic_props_id:
          type: string
          description: The ID for dynamic props
    ConfigurablePropAlertType:
      type: string
      enum:
      - info
      - neutral
      - warning
      - error
      description: The severity level of the alert.
    ConfigurablePropAirtableBaseId:
      allOf:
      - $ref: '#/components/schemas/ConfigurablePropBase'
      - type: object
        description: This prop is used to select an Airtable base.
        required:
        - type
        - appProp
        properties:
          type:
            type: string
            enum:
            - $.airtable.baseId
          appProp:
            type: string
            description: The name of the app prop that provides Airtable authentication
    GetComponentResponse:
      type: object
      description: Response received when retrieving a specific component
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Component'
    ComponentStash:
      type: string
      enum:
      - optional
      - required
      description: Indicates if a File Stash ID is optional or required to run the component
      nullable: true
    ReloadPropsResponse:
      type: object
      description: Response from reloading component props
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        errors:
          type: array
          items:
            type: string
          description: Any errors that occurred during configuration
        dynamicProps:
          $ref: '#/components/schemas/DynamicProps'
    ToolAnnotations:
      type: object
      description: Optional properties describing component behavior
      nullable: true
      properties:
        destructiveHint:
          type: boolean
          description: If true, the component may perform destructive updates to its environment. If false, the component performs only additive updates.
          nullable: true
        idempotentHint:
          type: boolean
          description: If true, calling the component repeatedly with the same arguments will have no additional effect on the its environment.
          nullable: true
        openWorldHint:
          type: boolean
          description: If true, this component may interact with an “open world” of external entities. If false, the component's domain of interaction is closed. For example, the world of a web search component is open, whereas that of a memory component is not.
          nullable: true
        readOnlyHint:
          type: boolean
          description: If true, the component does not modify its environment.
          nullable: true
        title:
          type: string
          description: A human-readable title for the component.
          nullable: true
    ConfigurablePropStringFormat:
      type: string
      enum:
      - file-ref
      x-fern-enum:
        file-ref:
          name: FileRef
      description: The format of the string value. `file-ref` indicates a URL of a file or path to a file in the component's /tmp directory.
      nullable: true
    ConfigurablePropString:
      allOf:
      - $ref: '#/components/schemas/ConfigurablePropBase'
      - type: object
        description: This prop can accept a string value.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - string
          secret:
            type: boolean
            description: If true, this prop is a secret and should not be displayed in plain text.
            nullable: true
          format:
            $ref: '#/components/schemas/ConfigurablePropStringFormat'
          default:
            $ref: '#/components/schemas/ConfiguredPropValueString'
          options:
            type: array
            items:
              anyOf:
              - $ref: '#/components/schemas/PropOption'
              - $ref: '#/components/schemas/PropOptionNested'
              - $ref: '#/components/schemas/PropOptionValue'
    ConfigurablePropTimerDefault:
      nullable: true
      description: Default timer configuration
      oneOf:
      - $ref: '#/components/schemas/TimerInterval'
      - $ref: '#/components/schemas/TimerCron'
    ConfigurablePropDir:
      allOf:
      - $ref: '#/components/schemas/ConfigurablePropBase'
      - type: object
        description: This prop is used to indicate how a component may access File Stash
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - dir
          accessMode:
            $ref: '#/components/schemas/ConfigurablePropDirAccessMode'
          sync:
            type: boolean
            description: If true, the component's /tmp directory is synchronized with File Stash
    ConfigurablePropSqlAuth:
      type: object
      properties:
        app:
          type: string
          description: The app that provides SQL authentication
      nullable: true
    HttpRequestBody:
      type: object
      description: Body configuration for HTTP request
      nullable: true
      properties:
        type:
          type: string
          enum:
          - fields
          - raw
          nullable: true
        contentType:
          type: string
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/HttpRequestField'
          nullable: true
        mode:
          type: string
          enum:
          - fields
          - raw
          nullable: true
        raw:
          type: string
          nullable: true
    ConfiguredProps:
      type: object
      description: The configured properties of the component
      additionalProperties:
        $ref: '#/components/schemas/ConfiguredPropValue'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth access token
