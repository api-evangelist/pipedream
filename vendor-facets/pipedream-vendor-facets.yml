# Vendor facets — Pipedream. Pipedream Connect exposes 3,000+ APIs as MCP servers at
# mcp.pipedream.com / remote.mcp.pipedream.net, with tools generated from its open-source registry of
# actions. The tools are Pipedream's (or community contributors'), the host is Pipedream's, and the
# provider is usually not involved — nothing without a declaration, `platform` (0.25) with one.
vendor: pipedream
name: Pipedream
website: https://pipedream.com
areas:
- mcp-hosting
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Pipedream turns its registry of pre-built actions into one MCP server per app, hosted on Pipedream's
  domain with Pipedream-managed OAuth. That is useful to agent builders and earns the wrapped API provider
  nothing on its own; a provider that declares its Pipedream MCP server earns `platform` credit (0.25
  of 12 agent-readiness points). The App Partners program has Pipedream build up to three triggers and
  actions for you — a derived artifact on Pipedream's surface, not a first-party one.
features:
- id: app-mcp-servers
  name: Per-app MCP servers
  description: >-
    Each supported app gets a dedicated MCP server whose tools are generated from Pipedream's registry
    of pre-built actions.
  source: https://pipedream.com/docs/connect/mcp.md
  tier: all
- id: remote-mcp
  name: Remote MCP endpoint for developers
  description: >-
    Apps connect to https://remote.mcp.pipedream.net/v3 with app and external user parameters to call
    tools on behalf of their users.
  source: https://pipedream.com/docs/connect/mcp/developers.md
  tier: paid
- id: managed-auth
  name: Connect managed auth
  description: Pipedream-run OAuth and credential storage for end users, with optional custom OAuth clients.
  source: https://pipedream.com/docs/connect/mcp.md
  tier: all
- id: app-partners
  name: App Partners program
  description: >-
    Pipedream's team builds the integration, an official OAuth client where applicable, and up to three
    triggers and three actions for a partner API.
  source: https://pipedream.com/docs/apps/app-partners.md
  tier: unknown
- id: registry-components
  name: Open-source component registry
  description: >-
    Actions and sources live in the PipedreamHQ/pipedream GitHub repo; anyone, including a provider, can
    contribute components for an integrated app.
  source: https://pipedream.com/docs/components/contributing.md
  tier: open-source
- id: custom-tools
  name: Custom tools on the MCP server
  description: A workspace can publish its own components as tools on Pipedream's MCP server.
  source: https://pipedream.com/docs/connect/mcp/developers.md
  tier: paid
maps:
- feature: app-mcp-servers
  check: mcp_server
  layer: agent_readiness
  grade: platform
  credit: 0.25
  conditional: true
  condition: >-
    Only if the provider declares its mcp.pipedream.com server in its own mcp/ manifest. Pipedream listing
    an MCP server for the API without the provider earns the provider nothing.
  provider_must: >-
    Declare the Pipedream-hosted server. Contributing its own components to the registry improves the
    tools but not the grade — the host and tool shape remain Pipedream's.
  note: >-
    One generated tool shape across 3,000+ apps on Pipedream's domain is exactly what 0.22.0 grades `platform`.
  points: 12
  baseline_pass_rate: 0.22
earns_nothing:
- feature: app-partners
  check: agent_skill_present
  why: >-
    Pipedream-built triggers and actions are Pipedream components, not an Agent Skill or any artifact
    a check reads on the provider.
- feature: registry-components
  check: examples_published
  why: >-
    Components live in Pipedream's monorepo; they count only if the provider declares them as its own
    examples, and they are Pipedream-shaped code.
- feature: managed-auth
  check: protected_resource_metadata
  why: >-
    OAuth runs on Pipedream's servers; nothing is served at the provider's /.well-known/oauth-protected-resource.
- feature: managed-auth
  check: dynamic_client_registration
  why: >-
    Pipedream maintains per-app OAuth clients; no registration_endpoint appears in the provider's discovery
    document.
- feature: remote-mcp
  check: mcp_endpoint_discoverable
  since: 0.23.0
  why: >-
    The callable endpoint is remote.mcp.pipedream.net/v3 with the app, external user id and the calling
    developer's Pipedream OAuth credentials; mcp.pipedream.com/app/<slug> is a web page. An agent cannot
    construct a provider endpoint unaided — `templated` at best.
- feature: remote-mcp
  check: agent_card
  why: No A2A agent card is produced for the provider.
out_of_reach:
  checks:
  - contract_present
  - spec_presence
  - llms_txt_published
  - agent_skills
  - well_known_catalog
  - auth_clarity
  - sdk_count_1
  note: >-
    Pipedream consumes provider APIs; its docs llms.txt, SDKs and MCP host are Pipedream's surface, not
    the provider's.
surface:
  agent_readiness:
    reachable: 3.0
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
method: searched
